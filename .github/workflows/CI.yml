# The package's own checks. Everything here is hermetic: no Node, no browser,
# no network beyond the registry. The jobs that need a real browser live in
# their own workflow so a browser download failure cannot redden this one.
name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    # The hermetic tier, and the first gate on every platform (D6). It needs no
    # Node, no browser and no network beyond the registry, which makes it the
    # cheapest possible Windows and macOS signal -- a couple of minutes against
    # a smoke job's fifteen.
    #
    # It also partitions Part B's failures into two kinds that want different
    # fixes: a hermetic failure on Windows is *this package's* portability bug
    # (a path, a line ending, a string comparison), while a smoke failure is the
    # driver bundle or the browser. Finding the first kind under the second
    # kind's feedback loop is how a week disappears.
    #
    # No engine axis here, deliberately: this job launches nothing.
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and current stable, on all three platforms.
        # macos-latest is Apple Silicon; the other two are x64.
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ["1.10", "1"]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  diagnostics:
    # THROWAWAY. Deleted at T23. This job exists to answer three Open Questions
    # from SPEC-M9.md that cannot be answered by reading anything, on the two
    # platforms the developer cannot run:
    #
    #   OQ 1  Does 7z's member filter match a forward-slashed path inside a
    #         .zip on Windows? (D9) If not, install_driver grows a separator
    #         branch and that fix is on the critical path for all of Windows.
    #   OQ 3  Which branded browsers do the runner images actually ship, and
    #         does Playwright's channel lookup find them? (D3a) This is the
    #         highest-leverage question in the milestone: a wrong answer
    #         invalidates D3a *and* D13 rather than costing a fix, and it is an
    #         hour's spec amendment here against a checkpoint's at T19 (R2).
    #   OQ 5  What does a Windows browser cache path cost, against the 260-char
    #         limit? Suspected fine, unverified, nasty to find late.
    #
    # Every step runs even when an earlier one failed, because a job that stops
    # at the first red answers one question instead of three.
    name: Diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1

      - name: "OQ 3a: what the runner image ships"
        if: always()
        shell: bash
        run: |
          echo "=== PATH-visible browsers ==="
          for exe in google-chrome google-chrome-stable chrome microsoft-edge microsoft-edge-stable msedge; do
            p=$(command -v "$exe" 2>/dev/null || true)
            if [ -n "$p" ]; then echo "FOUND $exe -> $p"; "$p" --version 2>&1 | head -1 || true; fi
          done
          echo "=== well-known locations ==="
          for p in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" \
            "/c/Program Files/Google/Chrome/Application/chrome.exe" \
            "/c/Program Files (x86)/Google/Chrome/Application/chrome.exe" \
            "/c/Program Files (x86)/Microsoft/Edge/Application/msedge.exe" \
            "/c/Program Files/Microsoft/Edge/Application/msedge.exe" \
            "/opt/google/chrome/chrome" \
            "/opt/microsoft/msedge/msedge" ; do
            if [ -f "$p" ]; then echo "FOUND $p"; else echo "absent  $p"; fi
          done

      - name: "OQ 1 + OQ 5: driver assembly and path lengths"
        if: always()
        run: |
          julia --project=. -e '
            using Playwright
            println("== platform ==")
            println("KERNEL=", Sys.KERNEL, "  ARCH=", Sys.ARCH, "  MACHINE=", Sys.MACHINE)
            println("node_platform=", Playwright.node_platform())
            println("node_url=", Playwright.node_url())

            println("== OQ 1: member-limited extraction ==")
            # The whole question. On Windows the archive is a .zip and the
            # member is a forward-slashed "node-v.../node.exe"; whether 7z
            # matches that on Windows is what this proves or disproves.
            dir = Playwright.install_driver()
            println("driver_dir=", dir)
            println("contents=", join(sort(readdir(dir)), ", "))
            run(Playwright.driver_cmd("--version"))

            println("== OQ 5: path lengths against Windows MAX_PATH (260) ==")
            # In a function, not at top level: a `for` at top level in -e is
            # soft scope, so assigning `deepest` inside it warns and then
            # throws UndefVarError.
            function deepest_path(root)
                best = ""
                for (dir, _, files) in walkdir(root), f in files
                    p = joinpath(dir, f)
                    length(p) > length(best) && (best = p)
                end
                return best
            end
            d = deepest_path(dir)
            println("driver_dir  len=", length(dir))
            println("deepest     len=", length(d), "  ", d)
            println("browsers_path=", something(Playwright.browsers_path(), "(default cache)"))'

      - name: "OQ 5b: browser cache path lengths"
        if: always()
        run: |
          julia --project=. -e '
            using Playwright
            function deepest_path(root)
                best = ""
                for (dir, _, files) in walkdir(root), f in files
                    p = joinpath(dir, f)
                    length(p) > length(best) && (best = p)
                end
                return best
            end
            Playwright.install(; browsers = ["chromium"])
            root = Playwright.browsers_path()
            d = deepest_path(root)
            println("browser root len=", length(root), "  ", root)
            println("deepest      len=", length(d), "  ", d)
            println(length(d) >= 260 ? "OVER MAX_PATH" : "under MAX_PATH")'

      - name: "OQ 3b: does the channel lookup find them?"
        if: always()
        run: |
          julia --project=. -e '
            using Playwright
            # The question D3a rests on. Not "is chrome on the box" -- that is
            # OQ 3a above -- but "does the *pinned driver* resolve the channel
            # to it". Those are different, and only this one decides whether
            # the four branded smoke jobs can exist without an install step.
            playwright() do pw
                for ch in ("chrome", "msedge")
                    try
                        b = launch(pw.chromium; headless = true, channel = ch)
                        println("channel ", ch, ": OK  name=", browser_name(b),
                                "  init=", get(b.initializer, "version", "?"))
                        close!(b)
                    catch e
                        println("channel ", ch, ": FAILED")
                        println(first(sprint(showerror, e), 2000))
                    end
                end
            end'

  smoke:
    # The job that makes CI mean something for this package: real browsers
    # against the local fixture server, one job per engine.
    name: Smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    env:
      # Relocate the browsers into the workspace so actions/cache can see them.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
          arch: x64
      - uses: julia-actions/cache@v3

      - name: Read the pinned driver versions
        id: pins
        # src/driver.jl is the single place these are set, so the cache key is
        # derived from it rather than restated here and left to drift.
        run: |
          julia -e '
            src = read("src/driver.jl", String)
            pw = match(r"const PLAYWRIGHT_VERSION = \"([^\"]+)\"", src)[1]
            node = match(r"const NODE_VERSION = \"([^\"]+)\"", src)[1]
            open(ENV["GITHUB_OUTPUT"], "a") do io
                println(io, "playwright=", pw)
                println(io, "node=", node)
            end'

      - name: Restore browsers and driver
        id: browsers
        uses: actions/cache@v6
        with:
          # Browsers only. The driver bundle lands in a Scratch.jl directory,
          # which julia-actions/cache above already covers
          # (cache-scratchspaces defaults to true) — caching the same path from
          # two actions would just race them against each other.
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-pw${{ steps.pins.outputs.playwright }}-node${{ steps.pins.outputs.node }}

      - name: Install driver and browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: julia bin/install.jl

      - uses: julia-actions/julia-buildpkg@v1
      - name: Smoke tests
        env:
          PLAYWRIGHT_JL_SMOKE: "1"
          PLAYWRIGHT_JL_ENGINE: ${{ matrix.engine }}
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  examples:
    # The four examples, on the committed Manifest, one job per engine. Slow
    # by nature: it loads Genie and Makie, and WGLMakie's first render costs
    # about a minute on a cold runner while SwiftShader compiles shaders on
    # the CPU.
    name: Examples (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
      PLAYWRIGHT_JL_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3

      - name: Read the pinned driver versions
        id: pins
        run: |
          julia -e '
            src = read("src/driver.jl", String)
            pw = match(r"const PLAYWRIGHT_VERSION = \"([^\"]+)\"", src)[1]
            node = match(r"const NODE_VERSION = \"([^\"]+)\"", src)[1]
            open(ENV["GITHUB_OUTPUT"], "a") do io
                println(io, "playwright=", pw)
                println(io, "node=", node)
            end'

      - name: Restore browsers
        id: browsers
        # The same key the smoke job uses, so whichever runs first pays for
        # the download and the other one does not.
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-pw${{ steps.pins.outputs.playwright }}-node${{ steps.pins.outputs.node }}

      - name: Install driver and browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: julia bin/install.jl

      - name: Install xvfb (firefox WebGL under a virtual display)
        # Firefox's `--headless` is hit-or-miss for WebGL — sometimes it
        # reports a WebGL context but paints only a flat background, which is
        # just what WGLMakie's pixel assertion guards against. Running headed
        # against a virtual X server lets Mesa's software GL stack take the
        # whole path through, the same way it renders locally. Chromium's
        # `--headless` ships SwiftShader and needs none of this.
        if: matrix.engine == 'firefox'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Instantiate the examples environment
        # No --update: the committed Manifest is the point.
        run: julia --project=examples -e 'using Pkg; Pkg.instantiate()'

      - name: Run the examples
        # Firefox runs headed under xvfb so its WebGL stack works; chromium
        # runs headless as before.
        run: |
          if [ "$PLAYWRIGHT_JL_ENGINE" = "firefox" ]; then
            PLAYWRIGHT_JL_HEADLESS=false xvfb-run -a julia --project=examples examples/runexamples.jl
          else
            julia --project=examples examples/runexamples.jl
          fi

      - name: Upload the artifacts the examples wrote
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: example-artifacts-${{ matrix.engine }}
          path: examples/output/
          if-no-files-found: warn

  codegen:
    # The generated channel layer is checked in, so it can drift from
    # protocol/spec/. --check compares byte for byte.
    name: Generated code in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          # Current stable, not 1.10: gen/Manifest.toml pins exact versions
          # (so the generated bytes are reproducible) and those versions need
          # a recent Julia. The generator is a developer toolchain, not part
          # of the package's supported matrix.
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate the generator environment
        run: julia --project=gen -e 'using Pkg; Pkg.instantiate()'
      - name: gen/generate.jl --check
        run: julia --project=gen gen/generate.jl --check

  format:
    # Uses the JuliaFormatter version pinned in gen/Manifest.toml — the same one
    # that formatted src/generated/, so the two checks cannot disagree.
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v2
        with:
          # Current stable, not 1.10: gen/Manifest.toml pins exact versions
          # (so the generated bytes are reproducible) and those versions need
          # a recent Julia. The generator is a developer toolchain, not part
          # of the package's supported matrix.
          version: "1"
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate the generator environment
        run: julia --project=gen -e 'using Pkg; Pkg.instantiate()'
      - name: Check formatting
        run: |
          julia --project=gen -e '
            using JuliaFormatter
            format(".", verbose = false) || error("Formatting check failed")'
      - name: Show what formatting would change
        if: failure()
        run: git --no-pager diff
