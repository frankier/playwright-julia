<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Network fixture</title>
    <!-- Deliberately absent from the server. With a route registered
         that matches neither of these, the unmatched requests must still be
         continued and the page must load normally. A page whose only requests
         are ones the test routes would not prove that. -->
    <link rel="stylesheet" href="/missing.css" />
  </head>
  <body>
    <h1>Network</h1>

    <!-- Same purpose as the stylesheet: an unmatched subresource. -->
    <img id="decoration" src="/missing.png" alt="" width="1" height="1" />

    <ul id="todos"></ul>
    <p id="status">idle</p>
    <p id="failure"></p>

    <button id="load">Load todos</button>
    <button id="post">Post a todo</button>
    <button id="hit">Hit the counter</button>
    <button id="echo">Echo headers</button>

    <script>
      const status = document.getElementById("status");
      const failure = document.getElementById("failure");
      const todos = document.getElementById("todos");

      // Every fetch reports its own outcome into the DOM, so a test asserts on
      // what the *page* saw rather than on what the test thinks it sent. An
      // aborted request lands in #failure, which is what abort! is asserted on.
      async function load(url, into) {
        try {
          const response = await fetch(url);
          const body = await response.text();
          into(body, response.status);
        } catch (e) {
          failure.textContent = "failed: " + e.message;
          status.textContent = "error";
        }
      }

      document.getElementById("load").addEventListener("click", () => {
        load("/api/todos", (body) => {
          todos.innerHTML = "";
          for (const item of JSON.parse(body)) {
            const li = document.createElement("li");
            li.textContent = item;
            todos.appendChild(li);
          }
          status.textContent = "loaded";
        });
      });

      document.getElementById("post").addEventListener("click", async () => {
        try {
          const response = await fetch("/api/todos", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ title: "written by the page" }),
          });
          status.textContent = "posted " + response.status;
        } catch (e) {
          failure.textContent = "failed: " + e.message;
          status.textContent = "error";
        }
      });

      document.getElementById("hit").addEventListener("click", () => {
        load("/api/hits", (body) => {
          status.textContent = "hits " + body;
        });
      });

      // The server echoes the headers it actually received, so a
      // `continue!(route; headers = …)` is proved by the server rather than by
      // the client believing its own rewrite.
      document.getElementById("echo").addEventListener("click", () => {
        load("/echo", (body) => {
          status.textContent = "echo " + body;
        });
      });
    </script>
  </body>
</html>
