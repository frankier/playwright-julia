<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Child Frame</title>
  </head>
  <body>
    <h1>Child</h1>
    <input id="child-input" value="" />
    <button id="child-button">Press me</button>
    <p id="child-status">untouched</p>

    <script>
      document.getElementById("child-button").addEventListener("click", () => {
        document.getElementById("child-status").textContent = "pressed";
      });
    </script>
  </body>
</html>
