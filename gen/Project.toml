# Generator-only environment. NEVER loaded at runtime — the package's own
# Project.toml is unaffected by anything in here (see SPEC-M2.md D2).
#
# Versions are pinned rather than bounded because the generator's output is
# checked in and verified byte-for-byte by `gen/generate.jl --check`; a
# formatter upgrade that reflows code would otherwise read as a spurious diff.

[deps]
Downloads = "f43a241f-c20a-4ad4-852c-f6b1247861c6"
JSON3 = "0f8b85d8-7281-11e9-16c2-39a750bddbf1"
JuliaFormatter = "98e50ef6-434e-11e9-1051-2b60c6c9e899"
YAML = "ddb6d928-2868-570f-bddf-ab3f9cf99eb6"

[compat]
JSON3 = "=1.14.3"
JuliaFormatter = "=1.0.62"
YAML = "=0.4.12"
julia = "1.10"
